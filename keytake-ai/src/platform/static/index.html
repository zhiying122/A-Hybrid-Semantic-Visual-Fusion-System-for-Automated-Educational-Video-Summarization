<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyTake AI — 自動化教學精華擷取平台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --primary-bg: #f0eeff;
      --success: #00b894;
      --success-light: #e6f9f4;
      --warning: #e17055;
      --error: #d63031;
      --dark: #2d3436;
      --dark-secondary: #636e72;
      --border: #e0e3e8;
      --border-light: #f0f0f0;
      --muted: #b2bec3;
      --bg: #f5f6fa;
      --card: #ffffff;
      --card-hover: #f8f9fa;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 2px 12px rgba(0,0,0,.07);
      --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
      --transition: .2s ease;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--dark);
      color: #fff;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-logo svg { flex-shrink: 0; }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
    .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,.15); margin: 0 4px; }
    header .subtitle { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
    .container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .video-wrapper {
      background: #0a0a0a;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .video-wrapper video { width: 100%; height: 100%; object-fit: contain; }
    .video-placeholder {
      color: var(--dark-secondary);
      text-align: center;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .video-placeholder svg { opacity: .35; }
    .video-placeholder p { color: var(--muted); font-size: 0.82rem; }
    .timeline {
      height: 18px;
      background: #e8ecef;
      position: relative;
      cursor: pointer;
      transition: background var(--transition);
    }
    .timeline:hover { background: #dfe3e6; }
    .timeline-segment {
      position: absolute;
      height: 100%;
      border-radius: 3px;
      opacity: .85;
      transition: opacity var(--transition), transform var(--transition);
      cursor: pointer;
    }
    .timeline-segment:hover { opacity: 1; transform: scaleY(1.3); z-index: 2; }
    .seg-semantic  { background: var(--success); }
    .seg-visual    { background: var(--warning); }
    .seg-combined  { background: var(--primary); }
    .timeline-legend {
      display: flex;
      gap: 20px;
      padding: 10px 20px;
      font-size: 0.75rem;
      color: var(--dark-secondary);
      border-bottom: 1px solid var(--border-light);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
      margin: 20px;
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color: var(--primary);
      background: var(--primary-bg);
    }
    .upload-area:active { transform: scale(.99); }
    .upload-area input { display: none; }
    .upload-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: background var(--transition);
    }
    .upload-area:hover .upload-icon { background: var(--primary-bg); }
    .upload-title { font-size: 0.88rem; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .upload-hint { font-size: 0.75rem; color: var(--muted); }
    .progress-wrap { padding: 20px; display: none; }
    .progress-bar { height: 6px; background: #e8ecef; border-radius: 3px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      width: 0%;
      transition: width .6s ease;
      border-radius: 3px;
    }
    .progress-label {
      font-size: 0.78rem;
      color: var(--dark-secondary);
      margin-top: 10px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-steps { display: flex; justify-content: space-between; margin-top: 16px; gap: 4px; }
    .progress-step {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; flex: 1; text-align: center;
    }
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: #e8ecef; color: var(--muted);
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: all .3s ease;
    }
    .step-circle .step-check { display: none; }
    .step-label { font-size: 0.68rem; color: var(--muted); transition: color .3s ease; white-space: nowrap; }
    .progress-step.active .step-circle {
      background: var(--primary); color: #fff;
      box-shadow: 0 2px 8px rgba(108,92,231,.35);
    }
    .progress-step.active .step-label { color: var(--primary); font-weight: 600; }
    .progress-step.done .step-circle { background: var(--success); color: #fff; }
    .progress-step.done .step-circle .step-num { display: none; }
    .progress-step.done .step-circle .step-check { display: block; }
    .progress-step.done .step-label { color: var(--success); font-weight: 500; }
    .video-switcher {
      padding: 0 20px 16px;
      display: none;
    }
    .switcher-group { display: flex; gap: 8px; }
    .stats {
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 20px;
    }
    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .stat-icon.purple { background: var(--primary-bg); }
    .stat-icon.green { background: var(--success-light); }
    .stat-icon.orange { background: #ffeee8; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .stat-label { font-size: 0.72rem; color: var(--dark-secondary); margin-top: 4px; }
    .stats.show { animation: fadeSlideIn .5s ease; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .duration-compare {
      padding: 0 20px 20px;
      display: none;
    }
    .dur-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .dur-row:last-child { margin-bottom: 0; }
    .dur-label-text { font-size: 0.75rem; color: var(--dark-secondary); min-width: 80px; }
    .dur-label-text.highlight { color: var(--primary); font-weight: 600; }
    .dur-track { flex: 1; height: 12px; background: #e8ecef; border-radius: 6px; overflow: hidden; }
    .dur-fill-orig { width: 100%; height: 100%; background: var(--muted); border-radius: 6px; }
    .dur-fill-summ {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 6px;
      transition: width .8s ease;
    }
    .dur-value { font-size: 0.75rem; color: var(--dark-secondary); min-width: 55px; text-align: right; }
    .dur-value.highlight { color: var(--primary); font-weight: 600; }
    .index-panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 112px);
      position: sticky;
      top: 84px;
    }
    .index-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .index-header h2 { font-size: 0.92rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .index-count {
      font-size: 0.7rem;
      background: var(--primary-bg);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .index-list { flex: 1; overflow-y: auto; padding: 6px 0; max-height: 440px; }
    .index-list::-webkit-scrollbar { width: 4px; }
    .index-list::-webkit-scrollbar-track { background: transparent; }
    .index-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .index-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background var(--transition);
      border-left: 3px solid transparent;
    }
    .index-item:hover { background: var(--card-hover); }
    .index-item.active { background: var(--primary-bg); border-left-color: var(--primary); }
    .index-time {
      font-size: 0.75rem; font-weight: 600; color: var(--primary);
      min-width: 48px; font-variant-numeric: tabular-nums;
      background: var(--primary-bg); padding: 2px 6px; border-radius: 4px;
    }
    .index-label { font-size: 0.82rem; color: var(--dark); flex: 1; line-height: 1.4; }
    .seg-badge {
      font-size: 0.62rem; padding: 2px 8px; border-radius: 10px;
      color: #fff; white-space: nowrap; flex-shrink: 0; font-weight: 500;
    }
    .badge-semantic { background: var(--success); }
    .badge-visual   { background: var(--warning); }
    .badge-combined { background: var(--primary); }
    .index-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 20px; border-radius: var(--radius-sm); border: none;
      cursor: pointer; font-size: 0.82rem; font-weight: 600;
      transition: all var(--transition); flex: 1;
      font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(108,92,231,.25); }
    .btn-primary:hover { background: #5b4bd5; box-shadow: 0 4px 12px rgba(108,92,231,.35); }
    .btn-outline {
      background: transparent; border: 1.5px solid var(--border);
      color: var(--dark-secondary);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
    .btn svg { flex-shrink: 0; }
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--muted); font-size: 0.85rem;
    }
    /* ── 課程摘要卡片 (v4 新增) ───────────────────────── */
    .course-card {
      background: linear-gradient(135deg, var(--primary) 0%, #8e77f7 100%);
      border-radius: var(--radius);
      padding: 20px;
      margin: 0 0 20px 0;
      color: #fff;
      display: none;
      animation: fadeSlideIn .5s ease;
    }
    .course-card-title {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .course-card-summary {
      font-size: 0.82rem; opacity: .9; line-height: 1.6; margin-bottom: 12px;
    }
    .course-concepts {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .concept-tag {
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.72rem;
      color: #fff;
      font-weight: 500;
    }
    /* ── 片段索引項目（v4：加入 stage badge）────────────── */
    .stage-badge {
      font-size: 0.58rem; padding: 1px 6px; border-radius: 8px;
      font-weight: 600; white-space: nowrap; flex-shrink: 0;
      border: 1px solid transparent;
    }
    .stage-derivation { background: #fff3f3; color: #d63031; border-color: #ffb8b8; }
    .stage-definition { background: #f0eeff; color: var(--primary); border-color: var(--primary-light); }
    .stage-example    { background: #fff9e6; color: #fdcb6e; border-color: #ffeaa7; }
    .stage-summary    { background: #e6f9f4; color: var(--success); border-color: #a8e6d8; }
    .stage-qa         { background: #f0f8ff; color: #0984e3; border-color: #b2d8ff; }
    .stage-transition { background: var(--bg); color: var(--muted); border-color: var(--border); }
    .empty-state svg { margin-bottom: 12px; opacity: .3; }
    .error-display {
      margin: 12px 20px;
      padding: 12px 16px;
      background: #ffeaea;
      border: 1px solid #ffc9c9;
      border-radius: var(--radius-sm);
      color: var(--error);
      font-size: 0.82rem;
      display: none;
    }
    footer.site-footer {
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border-light);
      margin-top: 12px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .index-panel { position: static; max-height: none; }
      .index-list { max-height: 300px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      header { padding: 0 16px; gap: 10px; }
      header h1 { font-size: 0.95rem; }
      .header-divider, header .subtitle { display: none; }
      .container { padding: 0 12px; margin: 16px auto; gap: 16px; }
      .upload-area { padding: 28px 16px; margin: 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 16px; }
      .stat-value { font-size: 1.2rem; }
      .progress-steps { gap: 2px; }
      .step-label { font-size: 0.6rem; }
      .index-footer { flex-direction: column; }
      .timeline-legend { gap: 12px; padding: 8px 16px; font-size: 0.68rem; }
    }
  </style>
</head>
<body>

<header role="banner">
  <div class="header-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a29bfe" stroke-width="2" aria-hidden="true">
      <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <h1>KeyTake AI</h1>
  </div>
  <div class="header-divider" aria-hidden="true"></div>
  <span class="subtitle">自動化教學精華擷取平台</span>
</header>

<main class="container" role="main">
  <!-- Left Column -->
  <div class="left-column">
    <section class="card video-panel" aria-label="影片播放區">
      <div class="video-wrapper" id="videoWrapper">
        <div class="video-placeholder" id="videoPlaceholder">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
            <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>
          </svg>
          <p>上傳影片後顯示摘要播放器</p>
        </div>
        <video id="videoPlayer" style="display:none" controls aria-label="影片播放器"></video>
      </div>

      <div class="timeline" id="timeline" role="slider" aria-label="影片時間軸" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <div class="timeline-legend" aria-label="時間軸圖例">
        <span class="legend-item"><span class="legend-dot" style="background:var(--success)" aria-hidden="true"></span>語意重點</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--warning)" aria-hidden="true"></span>板書書寫</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--primary)" aria-hidden="true"></span>雙模態對齊</span>
      </div>

      <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-label="上傳影片">
        <input type="file" id="fileInput" accept="video/*" aria-label="選擇影片檔案" />
        <div class="upload-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="upload-title">點擊或拖曳影片至此處上傳</p>
        <p class="upload-hint">支援 MP4、AVI、MOV、MKV（建議 500MB 以內）</p>
      </div>

      <div class="progress-wrap" id="progressWrap" role="status" aria-live="polite">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">處理中...</div>
        <div class="progress-steps" aria-label="處理步驟">
          <div class="progress-step" id="pstep0">
            <span class="step-circle"><span class="step-num">1</span><svg class="step-check" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span class="step-label">前處理</span>
          </div>
          <div class="progress-step" id="pstep1">
            <span class="step-circle"><span class="step-num">2</span><svg class="step-check" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span class="step-label">語音轉錄</span>
          </div>
          <div class="progress-step" id="pstep2">
            <span class="step-circle"><span class="step-num">3</span><svg class="step-check" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span class="step-label">視覺分析</span>
          </div>
          <div class="progress-step" id="pstep3">
            <span class="step-circle"><span class="step-num">4</span><svg class="step-check" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span class="step-label">融合剪輯</span>
          </div>
        </div>
        <div style="text-align:center;margin-top:12px">
          <button class="btn btn-outline" id="btnCancel" onclick="resetUI()" style="font-size:.75rem;padding:6px 16px;display:none" aria-label="取消處理並重新上傳">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            取消並重新上傳
          </button>
        </div>
      </div>
    </section>

    <!-- Video Switcher -->
    <div id="videoSwitcher" class="video-switcher" style="display:none" aria-label="影片切換">
      <div class="switcher-group">
        <button class="btn btn-outline" id="btnOriginal" onclick="switchVideo('original')" aria-label="播放原始影片">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          原始影片
        </button>
        <button class="btn btn-primary" id="btnSummary" onclick="switchVideo('summary')" aria-label="播放摘要影片">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          摘要影片
        </button>
        <button class="btn btn-outline" id="btnReset" onclick="resetUI()" aria-label="重新上傳影片" style="flex:0.6">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          重新上傳
        </button>
      </div>
    </div>

    <!-- Course Summary Card (v4 新增) -->
    <div id="courseCard" class="course-card" role="region" aria-label="課程摘要">
      <div class="course-card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span id="courseTitle">課程分析</span>
      </div>
      <p class="course-card-summary" id="courseSummaryText"></p>
      <div class="course-concepts" id="courseConceptsWrap" aria-label="關鍵概念"></div>
    </div>

    <!-- Stats Cards -->
    <section class="stats" id="statsArea" style="display:none" aria-label="摘要統計">
      <div class="stat-card">
        <div class="stat-icon purple" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-value" id="statOriginal">--</div>
        <div class="stat-label">原始時長（分鐘）</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-value" id="statSummary">--</div>
        <div class="stat-label">摘要時長（分鐘）</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
        <div class="stat-value" id="statSaving">--</div>
        <div class="stat-label">時間節省率</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </div>
        <div class="stat-value" id="statSegments">--</div>
        <div class="stat-label">精華片段數</div>
      </div>
    </section>

    <!-- Duration Compare -->
    <div id="durationCompare" class="duration-compare" style="display:none" aria-label="時長對比">
      <div class="dur-row">
        <span class="dur-label-text">原始長度</span>
        <div class="dur-track"><div class="dur-fill-orig"></div></div>
        <span class="dur-value" id="durOrigLabel">--</span>
      </div>
      <div class="dur-row">
        <span class="dur-label-text highlight">AI 濃縮</span>
        <div class="dur-track"><div class="dur-fill-summ" id="durSummaryBar"></div></div>
        <span class="dur-value highlight" id="durSummLabel">--</span>
      </div>
    </div>
  </div>

  <!-- Right Column: Index Panel -->
  <aside class="index-panel" aria-label="精華片段索引">
    <div class="index-header">
      <h2>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        精華片段索引
      </h2>
      <span id="segCount" class="index-count" aria-live="polite">--</span>
    </div>
    <div class="index-list" id="indexList" role="list" aria-label="片段列表">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <p>上傳影片後自動生成索引</p>
      </div>
    </div>
    <div class="index-footer">
      <button class="btn btn-primary" id="btnDownload" disabled aria-label="下載濃縮影片">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下載濃縮影片
      </button>
      <button class="btn btn-outline" id="btnExport" disabled aria-label="匯出索引 JSON">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        匯出索引
      </button>
    </div>
  </aside>
</main>

<footer class="site-footer" role="contentinfo">
  KeyTake AI — 自動化教學精華擷取系統
</footer>

<script>
  const API = "";  // 同源，留空即可

  let taskId = null;
  let pollTimer = null;
  let indexData = [];
  let originalVideoUrl = null;

  // ── 上傳區互動 ──────────────────────────────────────────
  const uploadArea = document.getElementById("uploadArea");
  const fileInput  = document.getElementById("fileInput");

  uploadArea.addEventListener("click", () => fileInput.click());
  uploadArea.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
  uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("drag-over"); });
  uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("drag-over"));
  uploadArea.addEventListener("drop", e => {
    e.preventDefault();
    uploadArea.classList.remove("drag-over");
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

  function handleFile(file) {
    // 檔案大小檢查（超過 500MB 提醒）
    const maxMB = 500;
    if (file.size > maxMB * 1024 * 1024) {
      if (!confirm(`檔案大小 ${(file.size / 1024 / 1024).toFixed(0)}MB，超過 ${maxMB}MB，處理時間可能很長。確定要上傳嗎？`)) return;
    }

    // 本地預覽
    const url = URL.createObjectURL(file);
    originalVideoUrl = url;
    const player = document.getElementById("videoPlayer");
    player.src = url;
    player.style.display = "block";
    document.getElementById("videoPlaceholder").style.display = "none";

    // 上傳至後端
    uploadVideo(file);
  }

  async function uploadVideo(file) {
    // 重置 UI 狀態
    document.getElementById("statsArea").style.display = "none";
    document.getElementById("indexList").innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><p>處理中...</p></div>';
    document.getElementById("btnDownload").disabled = true;
    document.getElementById("btnExport").disabled = true;
    document.getElementById("progressLabel").style.color = "var(--dark-secondary)";
    document.getElementById("progressFill").style.background = "linear-gradient(90deg, var(--primary), var(--primary-light))";
    document.getElementById("uploadArea").style.display = "block";

    setProgress(0, "上傳中...");
    document.getElementById("btnCancel").style.display = "inline-flex";
    const form = new FormData();
    form.append("file", file);

    try {
      const res = await fetch(`${API}/upload`, { method: "POST", body: form });
      const data = await res.json();
      taskId = data.task_id;
      pollStatus();
    } catch (e) {
      setProgress(0, `上傳失敗：${e.message}`);
    }
  }

  // ── 輪詢任務狀態 ────────────────────────────────────────
  function pollStatus() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`${API}/status/${taskId}`);
        const data = await res.json();

        if (data.status === "processing") {
          const step = data.step ?? 0;
          const total = data.step_total ?? 4;
          const pct = data.progress_pct ?? Math.round((step / total) * 100);
          const stepName = data.step_name ?? "處理中";
          const eta = data.eta ?? "";
          const msg = data.message ?? "";
          setProgress(pct, `步驟 ${step + 1}/${total}：${stepName}${msg ? ' — ' + msg : ''}${eta ? '　預估剩餘 ' + eta : ''}`);
        } else if (data.status === "queued") {
          setProgress(5, "排隊等待處理...");
        } else if (data.status === "done") {
          clearInterval(pollTimer);
          setProgress(100, "摘要生成完成");
          document.getElementById("uploadArea").style.display = "none";
          document.getElementById("btnCancel").style.display = "none";
          renderResult(data.result);
        } else if (data.status === "error") {
          clearInterval(pollTimer);
          setProgress(0, `錯誤：${data.error}`);
          showError(data.error);
        }
      } catch (e) {
        clearInterval(pollTimer);
        showError("無法連線至伺服器，請確認後端是否正常運行");
      }
    }, 2000);
  }

  // ── 渲染結果 ────────────────────────────────────────────
  function renderResult(result) {
    // v4：支援新格式（result.segments 直接是陣列或從舊格式讀取）
    indexData = result.segments || [];
    const total = result.original_duration || 1;
    const summary = result.summary_duration || 0;

    // ── v4：渲染課程摘要卡片 ──────────────────────────────
    const courseSummary = result.course_summary || {};
    const courseCard = document.getElementById("courseCard");
    if (courseSummary.title || courseSummary.summary) {
      document.getElementById("courseTitle").textContent =
        courseSummary.title || "課程摘要";
      document.getElementById("courseSummaryText").textContent =
        courseSummary.summary || "";

      const conceptsWrap = document.getElementById("courseConceptsWrap");
      conceptsWrap.innerHTML = "";
      (courseSummary.key_concepts || []).forEach(concept => {
        if (!concept) return;
        const tag = document.createElement("span");
        tag.className = "concept-tag";
        tag.textContent = concept;
        conceptsWrap.appendChild(tag);
      });

      courseCard.style.display = "block";
    } else {
      courseCard.style.display = "none";
    }

    // ── 統計卡片 ──────────────────────────────────────────
    document.getElementById("statsArea").style.display = "grid";
    document.getElementById("statsArea").classList.add("show");
    document.getElementById("statOriginal").textContent = (total / 60).toFixed(1);
    document.getElementById("statSummary").textContent  = (summary / 60).toFixed(1);
    document.getElementById("statSaving").textContent   = ((1 - summary / total) * 100).toFixed(0) + "%";
    document.getElementById("statSegments").textContent = indexData.length;
    document.getElementById("segCount").textContent     = `${indexData.length} 個片段`;

    // ── 時間軸 ────────────────────────────────────────────
    const timeline = document.getElementById("timeline");
    timeline.innerHTML = "";
    const typeClassMap = {
      semantic: "seg-semantic",
      visual:   "seg-visual",
      combined: "seg-combined"
    };
    indexData.forEach(seg => {
      const div = document.createElement("div");
      div.className = "timeline-segment " + (typeClassMap[seg.type] || "seg-combined");
      div.style.left  = (seg.start_sec / total * 100) + "%";
      div.style.width = ((seg.end_sec - seg.start_sec) / total * 100) + "%";
      div.title = `${seg.timestamp} ${seg.label}`;
      div.addEventListener("click", () => {
        const player = document.getElementById("videoPlayer");
        player.currentTime = seg.start_sec;
        player.play();
      });
      timeline.appendChild(div);
    });

    // ── 索引列表（v4：加入教學階段 badge）────────────────
    const list = document.getElementById("indexList");
    list.innerHTML = "";

    // 教學階段 badge 配置
    const stageBadgeMap = {
      derivation: { cls: "stage-derivation", label: "推導" },
      definition: { cls: "stage-definition", label: "定義" },
      example:    { cls: "stage-example",    label: "例題" },
      summary:    { cls: "stage-summary",    label: "總結" },
      qa:         { cls: "stage-qa",         label: "問答" },
      transition: { cls: "stage-transition", label: "過渡" },
    };
    const typeBadgeMap = {
      semantic: { cls: "badge-semantic", label: "語意" },
      visual:   { cls: "badge-visual",   label: "板書" },
      combined: { cls: "badge-combined", label: "雙模態" },
    };

    indexData.forEach((seg, i) => {
      const item = document.createElement("div");
      item.className = "index-item";
      item.setAttribute("role", "listitem");

      const typeBadge = typeBadgeMap[seg.type] || typeBadgeMap.combined;
      const stageBadge = stageBadgeMap[seg.stage] || stageBadgeMap[seg.type] || null;

      // 教學階段 badge（v4 新增）
      const stageBadgeHtml = stageBadge
        ? `<span class="stage-badge ${stageBadge.cls}" title="教學階段">${stageBadge.label}</span>`
        : "";

      item.innerHTML = `
        <span class="index-time">${seg.timestamp}</span>
        <span class="index-label">${seg.label || seg.timestamp}</span>
        ${stageBadgeHtml}
        <span class="seg-badge ${typeBadge.cls}">${typeBadge.label}</span>
      `;
      item.addEventListener("click", () => {
        document.querySelectorAll(".index-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        const player = document.getElementById("videoPlayer");
        player.currentTime = seg.start_sec;
        player.play();
      });
      list.appendChild(item);
    });

    // ── 啟用按鈕 ──────────────────────────────────────────
    document.getElementById("btnDownload").disabled = false;
    document.getElementById("btnExport").disabled   = false;

    // ── 時長對比條 ────────────────────────────────────────
    const durCompare = document.getElementById("durationCompare");
    durCompare.style.display = "block";
    document.getElementById("durOrigLabel").textContent = (total / 60).toFixed(1) + " min";
    document.getElementById("durSummLabel").textContent = (summary / 60).toFixed(1) + " min";
    const pctWidth = total > 0 ? Math.round((summary / total) * 100) : 0;
    setTimeout(() => {
      document.getElementById("durSummaryBar").style.width = pctWidth + "%";
    }, 100);

    // ── 影片切換按鈕 ──────────────────────────────────────
    document.getElementById("videoSwitcher").style.display = "block";
  }

  // ── 重新上傳（重置整個 UI）────────────────────────────
  function resetUI() {
    // 停止輪詢
    clearInterval(pollTimer);
    taskId = null;
    indexData = [];
    originalVideoUrl = null;

    // 重置影片播放器
    const player = document.getElementById("videoPlayer");
    player.pause();
    player.removeAttribute("src");
    player.style.display = "none";
    document.getElementById("videoPlaceholder").style.display = "flex";

    // 重置上傳區
    document.getElementById("uploadArea").style.display = "block";
    document.getElementById("fileInput").value = "";

    // 隱藏所有結果區塊（v4：加入 courseCard）
    document.getElementById("courseCard").style.display = "none";
    document.getElementById("videoSwitcher").style.display = "none";
    document.getElementById("statsArea").style.display = "none";
    document.getElementById("durationCompare").style.display = "none";
    document.getElementById("progressWrap").style.display = "none";
    document.getElementById("btnCancel").style.display = "none";
    document.getElementById("timeline").innerHTML = "";

    // 重置索引面板
    document.getElementById("indexList").innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg><p>上傳影片後自動生成索引</p></div>';
    document.getElementById("segCount").textContent = "--";
    document.getElementById("btnDownload").disabled = true;
    document.getElementById("btnExport").disabled = true;

    // 重置進度條樣式
    document.getElementById("progressLabel").style.color = "var(--dark-secondary)";
    document.getElementById("progressFill").style.background = "linear-gradient(90deg, var(--primary), var(--primary-light))";
    document.getElementById("progressFill").style.width = "0%";

    // 重置步驟指示器
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(`pstep${i}`);
      if (el) el.className = "progress-step";
    }
  }

  // ── 影片切換（原始 / 摘要）────────────────────────────
  function switchVideo(mode) {
    const player = document.getElementById("videoPlayer");
    if (mode === "summary" && taskId) {
      player.src = `${API}/download/${taskId}`;
      document.getElementById("btnSummary").className = "btn btn-primary";
      document.getElementById("btnOriginal").className = "btn btn-outline";
    } else if (originalVideoUrl) {
      player.src = originalVideoUrl;
      document.getElementById("btnOriginal").className = "btn btn-primary";
      document.getElementById("btnSummary").className = "btn btn-outline";
    }
    player.play();
  }

  // ── 下載 / 匯出 ─────────────────────────────────────────
  document.getElementById("btnDownload").addEventListener("click", () => {
    if (taskId) window.open(`${API}/download/${taskId}`, "_blank");
  });

  document.getElementById("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(indexData, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "keytake_index.json";
    a.click();
  });

  // ── 錯誤提示 ────────────────────────────────────────
  function showError(message) {
    const wrap = document.getElementById("progressWrap");
    wrap.style.display = "block";
    const label = document.getElementById("progressLabel");
    label.textContent = "處理失敗：" + message;
    label.style.color = "var(--error)";
    document.getElementById("progressFill").style.background = "var(--error)";
    document.getElementById("progressFill").style.width = "100%";
  }

  // ── 工具函式 ────────────────────────────────────────────
  function setProgress(pct, label) {
    const wrap = document.getElementById("progressWrap");
    wrap.style.display = "block";
    document.getElementById("progressFill").style.width  = pct + "%";
    const labelEl = document.getElementById("progressLabel");

    // If completed, show with CSS checkmark
    if (pct >= 100 && !label.startsWith("錯誤")) {
      labelEl.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="3" style="flex-shrink:0" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> ' + label;
    } else {
      labelEl.textContent = label;
    }

    // 更新步驟指示器
    const stepPcts = [0, 10, 60, 90, 100];
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(`pstep${i}`);
      if (!el) continue;
      if (pct >= stepPcts[i + 1]) {
        el.className = "progress-step done";
      } else if (pct >= stepPcts[i]) {
        el.className = "progress-step active";
      } else {
        el.className = "progress-step";
      }
    }
  }
</script>
</body>
</html>
